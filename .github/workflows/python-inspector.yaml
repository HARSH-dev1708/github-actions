name: Python Inspector

on:
  push:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print versions
        run: |
          python --version
          pip --version

      - name: Print Python location
        run: which python

      - name: Report complete
        run: echo "Inspection complete"