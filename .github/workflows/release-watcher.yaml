name: Release Watcher

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Print triggering event
        run: echo "Triggered by ${{ github.event_name }}"
      
      - name: Print date and time
        run: date
      
      - name: Report complete
        run: echo "Release watch complete"