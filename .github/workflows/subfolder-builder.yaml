name: Subfolder Builder

# on:
#     push:
#     workflow_dispatch:

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24.x'
            - name: Install dependencies
              run: npm ci
            - name: Run Unit Tests
              run: npm run test
            - name: Build React App
              run: npm run build
            - name: Report complete
              run: echo "Subfolder build complete"