name: System Report

on:
  push:

jobs:
  system-info:
    runs-on: ubuntu-latest

    steps:
        - name: Print system information
          run: |
            echo "Operating System: $(uname -s)"
            echo "Kernel Version: $(uname -r)"
            # df -h / → shows disk usage/free space for the root filesystem in a human-readable format.
            echo "Disk Usage: $(df -h)"
            echo "Date: $(date)"


  tool-check:
    runs-on: ubuntu-latest

    steps:
        - name: Placeholder for Tool Check
          run: |
            echo "This step is a placeholder for checking installed tools and their versions."
